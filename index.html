<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decarbonisation News — Scan Desk</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --text:#e8edf2; --muted:#93a1b0; --accent:#3ddc97; --accent2:#5aa9ff;
    --warn:#f0b429; --danger:#e5484d; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:19px;margin:0;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  button.danger{color:var(--danger)}
  .bar{padding:16px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);font-size:13px}
  .chip.active{color:var(--text);border-color:var(--accent);background:rgba(61,220,151,.10)}
  .chip .n{opacity:.6;margin-left:6px}
  .grid{padding:24px 28px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;display:flex;flex-direction:column;gap:12px;min-height:190px}
  .card .sec{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2)}
  .card h3{margin:0;font-size:16px;line-height:1.35}
  .card .snip{color:var(--muted);font-size:13.5px;flex:1}
  .card .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
  .card .meta a{color:var(--accent2);text-decoration:none}
  .card .actions{display:flex;gap:8px;margin-top:4px}
  .status{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .status.new{color:var(--accent2)}
  .status.generating{color:var(--warn);border-color:var(--warn)}
  .status.published{color:var(--accent);border-color:var(--accent)}
  .status.rejected{color:var(--danger);border-color:var(--danger)}
  .empty{padding:60px 28px;text-align:center;color:var(--muted)}
  .config{padding:10px 28px;font-size:12px;color:var(--muted);background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .config code{color:var(--accent2)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--accent2);padding:12px 18px;border-radius:10px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>Decarbonisation News · Scan Desk</h1>
    <div class="sub">Candidate stories from the daily scan. Click Generate to build the article and image.</div>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="refresh">↻ Refresh</button>
</header>

<div class="config" id="configline"></div>

<div class="bar" id="filters"></div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG  —  wire these two to go live
   ------------------------------------------------------------
   DATA_SOURCE : URL returning candidate rows.
                 Accepts a Google Sheets "Publish to web" CSV link,
                 or any JSON endpoint returning an array of rows.
                 Leave "" to use the built-in sample data.
   GENERATE_WEBHOOK : Make.com webhook URL. Clicking Generate POSTs
                 the candidate row here to start article+image build.
   ============================================================ */
const DATA_SOURCE = "";
const GENERATE_WEBHOOK = "";

const SECTIONS = [
  "AI for Decarbonisation","AI for Materials","Data",
  "Finance & Investment","Supply chain & operations","Technologies & innovation"
];

/* Sample candidates so the desk is demonstrable before the scan is wired */
const SAMPLE = [
  {id:"s1",date_found:"2026-07-23",section:"Technologies & innovation",
   headline:"Cement maker fires first full-scale kiln on hydrogen process heat",
   snippet:"A European producer reports a pilot kiln running on hydrogen, targeting a cut in fuel-related emissions at one plant.",
   source_urls:"https://example.com/a"},
  {id:"s2",date_found:"2026-07-23",section:"Finance & Investment",
   headline:"Transition fund closes at record size for heavy-industry projects",
   snippet:"A new industrial transition fund reaches final close, earmarking capital for steel and chemicals decarbonisation.",
   source_urls:"https://example.com/b"},
  {id:"s3",date_found:"2026-07-23",section:"AI for Materials",
   headline:"Model screens thousands of low-carbon cement blends in days",
   snippet:"Researchers use a materials-discovery model to shortlist supplementary cementitious mixes for testing.",
   source_urls:"https://example.com/c"},
  {id:"s4",date_found:"2026-07-23",section:"Data",
   headline:"New tracker maps CCS project pipeline against 2030 targets",
   snippet:"An updated project tracker compiles announced capture capacity by sector and region.",
   source_urls:"https://example.com/d"},
  {id:"s5",date_found:"2026-07-23",section:"AI for Decarbonisation",
   headline:"Steelworks cuts furnace energy use with control-system AI",
   snippet:"A plant reports lower energy intensity after deploying an AI control layer on its furnaces.",
   source_urls:"https://example.com/e"},
  {id:"s6",date_found:"2026-07-23",section:"Supply chain & operations",
   headline:"Manufacturer sets supplier decarbonisation targets across Scope 3",
   snippet:"A large industrial buyer publishes supplier emissions requirements covering its highest-emitting inputs.",
   source_urls:"https://example.com/f"}
];

const STORE_KEY = "scandesk_status_v1";
let statusMap = {};
try{ statusMap = JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch(e){}
let rows = [];
let activeSection = "All";

function saveStatus(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(statusMap)); }catch(e){} }
function statusOf(r){ return statusMap[r.id] || r.status || "new"; }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
}

async function loadRows(){
  document.getElementById("configline").innerHTML =
    DATA_SOURCE
      ? `Source: <code>${DATA_SOURCE}</code>`
      : `Source: <code>built-in sample data</code> — set <code>DATA_SOURCE</code> in the file to read your live sheet.`;
  if(!DATA_SOURCE){ rows = SAMPLE.slice(); render(); return; }
  try{
    const res = await fetch(DATA_SOURCE);
    const text = await res.text();
    rows = text.trim().startsWith("[") ? JSON.parse(text) : parseCSV(text);
  }catch(e){
    toast("Could not load source, showing sample."); rows = SAMPLE.slice();
  }
  render();
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const head = splitCSVLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(l=>{
    const cells = splitCSVLine(l); const o={};
    head.forEach((h,i)=>o[h]=(cells[i]||"").trim()); return o;
  });
}
function splitCSVLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===','&&!q){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}

function render(){
  renderFilters();
  const grid=document.getElementById("grid");
  const list = rows.filter(r=> activeSection==="All" || r.section===activeSection);
  if(!list.length){ grid.innerHTML = `<div class="empty">No candidates in this section.</div>`; return; }
  grid.innerHTML = list.map(cardHTML).join("");
  list.forEach(r=>{
    const el=document.getElementById("gen-"+r.id);
    if(el) el.onclick=()=>generate(r);
    const rej=document.getElementById("rej-"+r.id);
    if(rej) rej.onclick=()=>{ statusMap[r.id]="rejected"; saveStatus(); render(); };
  });
}

function renderFilters(){
  const counts={All:rows.length};
  SECTIONS.forEach(s=>counts[s]=rows.filter(r=>r.section===s).length);
  const chips=["All",...SECTIONS].map(s=>
    `<div class="chip ${s===activeSection?'active':''}" data-sec="${s}">${s}<span class="n">${counts[s]||0}</span></div>`
  ).join("");
  const f=document.getElementById("filters"); f.innerHTML=chips;
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeSection=c.dataset.sec;render();});
}

function cardHTML(r){
  const st=statusOf(r);
  const src=(r.source_urls||"").split(",")[0].trim();
  const canGen = st==="new";
  return `<div class="card">
    <div class="sec">${r.section||""}</div>
    <h3>${r.headline||"(untitled)"}</h3>
    <div class="snip">${r.snippet||""}</div>
    <div class="meta">
      <span class="status ${st}">${st}</span>
      ${src?`<a href="${src}" target="_blank" rel="noopener">source ↗</a>`:""}
      <span>${r.date_found||""}</span>
    </div>
    <div class="actions">
      <button class="primary" id="gen-${r.id}" ${canGen?"":"disabled style=opacity:.4;cursor:default"}>
        ${st==="generating"?"Generating…":st==="published"?"Published":"Generate"}
      </button>
      ${canGen?`<button class="ghost danger" id="rej-${r.id}">Reject</button>`:""}
    </div>
  </div>`;
}

async function generate(r){
  statusMap[r.id]="generating"; saveStatus(); render();
  if(!GENERATE_WEBHOOK){
    toast("Generate fired (demo). Set GENERATE_WEBHOOK to build live.");
    return;
  }
  try{
    await fetch(GENERATE_WEBHOOK,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(r)
    });
    toast("Sent to generation pipeline.");
  }catch(e){
    toast("Webhook error — check the URL.");
    statusMap[r.id]="new"; saveStatus(); render();
  }
}

document.getElementById("refresh").onclick=loadRows;
loadRows();
</script>
</body>
</html>
