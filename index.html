<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decarbonisation News — Scan Desk</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --text:#e8edf2; --muted:#93a1b0; --accent:#3ddc97; --accent2:#5aa9ff;
    --warn:#f0b429; --danger:#e5484d; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:19px;margin:0;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  button.danger{color:var(--danger)}
  .bar{padding:16px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);font-size:13px;cursor:pointer}
  .chip.active{color:var(--text);border-color:var(--accent);background:rgba(61,220,151,.10)}
  .chip .n{opacity:.6;margin-left:6px}
  .grid{padding:24px 28px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;display:flex;flex-direction:column;gap:12px;min-height:190px}
  .card .sec{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2)}
  .card h3{margin:0;font-size:16px;line-height:1.35}
  .card .snip{color:var(--muted);font-size:13.5px;flex:1}
  .card .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .card .meta a{color:var(--accent2);text-decoration:none}
  .card .actions{display:flex;gap:8px;margin-top:4px}
  .empty{padding:60px 28px;text-align:center;color:var(--muted)}
  .config{padding:10px 28px;font-size:12px;color:var(--muted);background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .config code{color:var(--accent2)}
  .config.err{color:var(--danger)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--accent2);padding:12px 18px;border-radius:10px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>Decarbonisation News · Scan Desk</h1>
    <div class="sub">Candidate stories from the daily scan. Generate builds the article and image. Reject removes it from the desk.</div>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="refresh">↻ Refresh</button>
</header>

<div class="config" id="configline">Loading…</div>

<div class="bar" id="filters"></div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ------------------------------------------------------------
   DATA_SOURCE      : live CSV of the queue sheet (Google Sheets gviz).
                      Requires the sheet be shared "Anyone with the link: Viewer".
   REJECT_WEBHOOK   : Make webhook that marks a row removed (status column).
   GENERATE_WEBHOOK : Make webhook that builds article + image (added at the
                      generation step). Leave "" until then.
   ============================================================ */
const DATA_SOURCE = "https://docs.google.com/spreadsheets/d/1f8Cc6Oa1GIdFTzpjErlhbPd0YavA4jp9vppIom7Ep-s/gviz/tq?tqx=out:csv&sheet=Untitled";
const REJECT_WEBHOOK = "https://hook.eu2.make.com/kue2sbx0df6vffx4ow1g8h55my4cgrfj";
const GENERATE_WEBHOOK = "";

/* Hide candidates older than this many days (matches the EVLife desk). */
const MAX_AGE_DAYS = 7;

const SECTIONS = [
  "AI for Decarbonisation","AI for Materials","Data",
  "Finance & Investment","Supply chain & operations","Technologies & innovation"
];

let rows = [];              // parsed candidates, each with a .sheetRow
let activeSection = "All";
const hiddenLocally = new Set();  // rows the user just rejected or generated this session

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
}

async function loadRows(){
  const cfg=document.getElementById("configline");
  cfg.className="config"; cfg.textContent="Loading candidates from the queue sheet…";
  try{
    const res = await fetch(DATA_SOURCE, {cache:"no-store"});
    const text = await res.text();
    rows = parseCSV(text);
    cfg.innerHTML = `Live from the queue sheet · ${rows.filter(isNew).length} open candidate(s) · last loaded ${new Date().toLocaleTimeString()}`;
  }catch(e){
    rows = [];
    cfg.className="config err";
    cfg.textContent="Could not load the sheet. Confirm it is shared as ‘Anyone with the link: Viewer’.";
  }
  render();
}

/* Parse CSV. Header is sheet row 1, so data line i (1-based) is sheet row i+1. */
function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").filter(l=>l.length);
  if(!lines.length) return [];
  const head = splitCSVLine(lines[0]).map(h=>h.trim());
  const out=[];
  for(let i=1;i<lines.length;i++){
    const cells = splitCSVLine(lines[i]); const o={};
    head.forEach((h,idx)=>o[h]=(cells[idx]||"").trim());
    o.sheetRow = i + 1;                 // header is row 1
    if((o.id||o.headline)) out.push(o); // skip fully blank lines
  }
  return out;
}
function splitCSVLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===','&&!q){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}

function statusOf(r){ return (r.status||"").trim().toLowerCase(); }
function isNew(r){ const s=statusOf(r); return s===""||s==="new"; }
function withinAge(r){
  if(!r.date_found) return true;
  const d = new Date(r.date_found);
  if(isNaN(d)) return true;
  return (Date.now() - d.getTime()) <= MAX_AGE_DAYS*86400000;
}
function visibleRows(){
  return rows.filter(r=> isNew(r) && withinAge(r) && !hiddenLocally.has(r.id||r.sheetRow));
}

function render(){
  renderFilters();
  const grid=document.getElementById("grid");
  const list = visibleRows().filter(r=> activeSection==="All" || r.section===activeSection);
  if(!list.length){ grid.innerHTML = `<div class="empty">No open candidates${activeSection==="All"?"":" in this section"}. New stories arrive with the daily scan.</div>`; return; }
  grid.innerHTML = list.map(cardHTML).join("");
  list.forEach(r=>{
    const key = r.id||r.sheetRow;
    const g=document.getElementById("gen-"+r.sheetRow); if(g) g.onclick=()=>generate(r);
    const j=document.getElementById("rej-"+r.sheetRow); if(j) j.onclick=()=>reject(r);
  });
}

function renderFilters(){
  const vis = visibleRows();
  const counts={All:vis.length};
  SECTIONS.forEach(s=>counts[s]=vis.filter(r=>r.section===s).length);
  const chips=["All",...SECTIONS].map(s=>
    `<div class="chip ${s===activeSection?'active':''}" data-sec="${s.replace(/"/g,'&quot;')}">${s}<span class="n">${counts[s]||0}</span></div>`
  ).join("");
  const f=document.getElementById("filters"); f.innerHTML=chips;
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeSection=c.dataset.sec;render();});
}

function cardHTML(r){
  const src=(r.source_urls||"").split(",")[0].trim();
  const srcName=(r.notes||"").trim();
  return `<div class="card">
    <div class="sec">${r.section||""}</div>
    <h3>${escapeHtml(r.headline||"(untitled)")}</h3>
    <div class="snip">${escapeHtml(r.snippet||"")}</div>
    <div class="meta">
      ${src?`<a href="${src}" target="_blank" rel="noopener">source ↗</a>`:""}
      ${srcName?`<span>${escapeHtml(srcName)}</span>`:""}
      <span>${r.date_found||""}</span>
    </div>
    <div class="actions">
      <button class="primary" id="gen-${r.sheetRow}">Generate</button>
      <button class="ghost danger" id="rej-${r.sheetRow}">Reject</button>
    </div>
  </div>`;
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function reject(r){
  hiddenLocally.add(r.id||r.sheetRow);
  render();
  if(!REJECT_WEBHOOK){ toast("Rejected locally (no webhook set)."); return; }
  fetch(`${REJECT_WEBHOOK}?row=${r.sheetRow}`, {mode:"no-cors"})
    .then(()=>toast("Rejected. Row marked removed in the sheet."))
    .catch(()=>toast("Rejected locally; sheet update may have failed."));
}

function generate(r){
  hiddenLocally.add(r.id||r.sheetRow);
  render();
  if(!GENERATE_WEBHOOK){ toast("Generate fired (demo). Set GENERATE_WEBHOOK to build live."); return; }
  fetch(GENERATE_WEBHOOK, {
    method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      row:r.sheetRow, id:r.id, section:r.section, headline:r.headline,
      snippet:r.snippet, source_urls:r.source_urls, date_found:r.date_found, notes:r.notes
    })
  }).then(()=>toast("Sent to the generation pipeline."))
    .catch(()=>toast("Generation webhook error."));
}

document.getElementById("refresh").onclick=loadRows;
loadRows();
</script>
</body>
</html>
