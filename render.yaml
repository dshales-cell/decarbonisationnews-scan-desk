services:
  - type: web
    name: decarbonisationnews-scan-desk
    runtime: static
    buildCommand: "echo no build step"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
